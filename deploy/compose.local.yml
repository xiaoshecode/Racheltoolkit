name: racheltoolkit

services:
  web:
    image: racheltoolkit:${TEACH_RELEASE:?set the verified release version}
    build: ..
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.production_local
      TEACH_STORAGE_BACKEND: local
      TEACH_DATA_DIR: /data
      TEACH_DB: /data/school.sqlite3
    user: "10001:10001"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777
    volumes:
      - type: bind
        source: ${TEACH_PERSIST_DIR:?set the existing private host data directory}
        target: /data
        bind:
          create_host_path: false
      - public-static:/data/staticfiles
    networks: [application]
    command:
      - sh
      - -ec
      - >-
        umask 077;
        python app/manage.py check --deploy --fail-level WARNING &&
        exec waitress-serve --listen=0.0.0.0:8000 --threads=8
        --trusted-proxy='*' --trusted-proxy-headers=x-forwarded-proto
        --max-request-body-size=110100480 config.wsgi:application
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, os, urllib.request;
          request = urllib.request.Request('http://127.0.0.1:8000/health/',
          headers={'Host': os.environ['TEACH_HOST'], 'X-Forwarded-Proto': 'https'});
          response = urllib.request.urlopen(request, timeout=5);
          assert response.status == 200 and json.load(response) == {'status': 'ok'}
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  https:
    image: caddy:2.11.8@sha256:f04f1e8d78da0c65ec6f81b4ea8d216849775f3bc3c87790d95fcb2ec3722f12
    restart: unless-stopped
    environment:
      TEACH_HOST: ${TEACH_HOST:?set the public IPv4 address}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    networks: [application, internet]
    volumes:
      - ./Caddyfile.ip:/etc/caddy/Caddyfile:ro
      - public-static:/srv/staticfiles:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  application:
    internal: true
  internet: {}

volumes:
  public-static:
  caddy-data:
  caddy-config:
