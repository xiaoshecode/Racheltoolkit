{% extends "base.html" %}{% block title %}工作区登录{% endblock %}
{% block content %}
<h1>登录教学工作区</h1>
<p>学生使用完整学号登录，包含开头的零。教师使用管理员分配的账号。</p>
{% if request.GET.updated %}<p role="status">密码已设置，请重新登录。</p>{% endif %}
<form method="post">{% csrf_token %}{{ form.as_p }}
<input type="hidden" name="next" value="{{ next }}">
<button>登录</button></form>
<p><a href="{% url 'school:activate' %}">首次激活</a> · <a href="{% url 'school:reset' %}">重设密码</a></p>
{% endblock %}
