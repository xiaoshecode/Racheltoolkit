{% extends "base.html" %}{% block title %}工作区登录{% endblock %}
{% block content %}<div class="auth-layout">
<section class="auth-intro"><p class="eyebrow">WELCOME BACK</p><h1>回到你的<br>教学与学习空间</h1><p class="muted">学生使用完整学号登录，包含开头的零。教师使用管理员分配的账号。</p><p><a href="/">浏览公开课程 →</a></p></section>
<section class="panel auth-panel"><h2>登录工作区</h2>
{% if request.GET.updated %}<p class="notice" role="status">密码已设置，请重新登录。</p>{% endif %}
<form method="post">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button>登录</button></form>
<p>有班级邀请码？<a href="{% url 'school:register' %}">学生自行注册</a></p>
<div class="auth-links"><a href="{% url 'school:activate' %}">首次激活</a><a href="{% url 'school:reset' %}">重设密码</a></div></section></div>{% endblock %}
