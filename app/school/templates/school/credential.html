{% extends "base.html" %}{% block title %}{{ title }}{% endblock %}
{% block content %}<div class="auth-layout"><section class="auth-intro"><p class="eyebrow">ACCOUNT ACCESS</p><h1>{{ title }}</h1><p class="muted">向学校管理员领取一小时内有效的一次性凭证，设置自己的密码。</p><p>请完整输入学号，保留开头的零。</p><p><a href="{% url 'school:login' %}">← 回到登录</a></p></section>
<section class="panel auth-panel"><h2>填写账号与凭证</h2><form method="post">{% csrf_token %}{{ form.as_p }}<button>设置密码</button></form></section></div>{% endblock %}
