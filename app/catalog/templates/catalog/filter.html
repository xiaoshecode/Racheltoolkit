<form method="get" class="catalog-filter" role="search"><label>查找资料<input type="search" name="q" maxlength="160" value="{{ query }}" placeholder="章名、关键词或文件名"></label><label>资料格式<select name="format"><option value="">全部格式</option>{% for f in formats %}<option value="{{ f }}" {% if f == file_format %}selected{% endif %}>{{ f }}</option>{% endfor %}</select></label><button>查找</button>{% if searching %}<a href="{{ request.path }}">清除条件</a>{% endif %}</form>
