name: Public portal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-portal
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python app/manage.py check && python app/manage.py makemigrations --check --dry-run && python app/manage.py test
      - name: Set verified teaching origin
        env:
          TEACH_ORIGIN: ${{ vars.TEACH_ORIGIN }}
        run: python deploy/portal_config.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portal/
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4

